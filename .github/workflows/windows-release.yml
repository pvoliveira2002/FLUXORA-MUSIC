name: Instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Configurar Node portátil
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt
          choco install innosetup --no-progress -y

      - name: Testar e gerar instalador
        shell: pwsh
        run: .\build_installer.ps1

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Fluxora-Setup-3.2.0
          path: dist/installer/Fluxora-Setup-3.2.0.exe
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/installer/Fluxora-Setup-3.2.0.exe" --title "Fluxora 3.2.0" --generate-notes
